services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-business-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_business
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: